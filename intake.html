<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1a3a2a">
<title>Your SEWB intake form · Worn Gundidj</title>
<!--
  Worn Gundidj CMS — the client's own SEWB intake form, opened from a link a
  worker texts or emails (https://<cms>/i#<link id>). No sign-in: the link id
  (and the client's date of birth, when one is on file) is what opens it, and
  the Firestore rules let a signed-out visitor do only this:
    • read the link's status (no personal details),
    • open the one form whose id they can compute — SHA-256(link id + ":" + DOB),
    • save answers to the intake questions only, and submit once,
  and only until the link expires. The worker then reviews the answers in the
  CMS and applies them to the client's SEWB intake.
  The link id sits after "#", so it is never sent to the web server or logged.
-->
<style>
  :root { --primary:#1a3a2a; --primary-light:#2d6a4f; --accent:#e07b39; --bg:#f6f1ea; --card:#fff; --text:#1f2937; --muted:#5b6472;
          --border:#d9d2c7; --ok:#065f46; --ok-bg:#d1fae5; --warn:#92400e; --warn-bg:#fef3c7; --err:#991b1b; --err-bg:#fee2e2; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { background:var(--primary); color:#fff; padding:14px 16px calc(14px + 2px); }
  .hd { max-width:640px; margin:0 auto; display:flex; align-items:center; gap:12px; }
  .hd .logo { background:#fff; border-radius:10px; padding:6px 8px; display:flex; flex:none; }
  .hd .logo img { height:38px; width:auto; display:block; }
  .hd h1 { font-size:17px; margin:0; line-height:1.25; font-weight:700; }
  .hd p { margin:2px 0 0; font-size:13px; opacity:.8; }
  main { max-width:640px; margin:0 auto; padding:16px 16px calc(110px + env(safe-area-inset-bottom)); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px 16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  h2 { font-size:22px; margin:0 0 6px; color:var(--primary); outline:none; }
  .intro { color:var(--muted); margin:0 0 6px; font-size:15px; }
  .progress { display:flex; align-items:center; gap:10px; margin:2px 0 14px; font-size:13px; color:var(--muted); font-weight:600; }
  .bar { flex:1; height:8px; background:#e8e1d6; border-radius:4px; overflow:hidden; }
  .bar > span { display:block; height:100%; background:var(--primary-light); border-radius:4px; transition:width .25s; }
  .f { margin:18px 0 0; border:0; padding:0; }
  .f > label, .f > legend { display:block; font-weight:650; font-size:16px; margin:0 0 6px; padding:0; }
  .help { font-size:13px; color:var(--muted); margin:-2px 0 6px; }
  input[type=text], input[type=tel], input[type=email], input[type=date], textarea {
    width:100%; font:inherit; font-size:17px; padding:12px 12px; border:1.5px solid var(--border); border-radius:10px; background:#fff; color:var(--text); }
  textarea { resize:vertical; min-height:76px; }
  input:focus, textarea:focus { outline:none; border-color:var(--primary-light); box-shadow:0 0 0 3px rgba(45,106,79,.18); }
  .opts { display:grid; gap:8px; }
  .opts.cols { grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); }
  .grp { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--primary-light); margin:16px 0 6px; }
  .grp:first-of-type { margin-top:4px; }
  .opt { display:flex; align-items:flex-start; gap:10px; padding:11px 12px; border:1.5px solid var(--border); border-radius:10px; background:#fff; cursor:pointer; font-size:16px; line-height:1.35; }
  .opt input { width:22px; height:22px; margin:0; flex:none; accent-color:var(--primary-light); }
  .opt:has(input:checked) { border-color:var(--primary-light); background:#eef7f1; }
  .opt:has(input:focus-visible) { box-shadow:0 0 0 3px rgba(45,106,79,.25); }
  .nav { position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.97); border-top:1px solid var(--border);
         padding:10px 16px calc(10px + env(safe-area-inset-bottom)); z-index:5; }
  .nav .in { max-width:640px; margin:0 auto; display:flex; gap:10px; align-items:center; }
  .btn { font:inherit; font-weight:700; font-size:16px; border-radius:10px; padding:13px 18px; border:1.5px solid var(--primary); cursor:pointer; background:#fff; color:var(--primary); min-height:48px; }
  .btn.primary { background:var(--primary); color:#fff; }
  .btn.primary:hover { background:var(--primary-light); }
  .btn:disabled { opacity:.55; cursor:default; }
  .btn.link { border:none; background:none; padding:6px 4px; min-height:0; text-decoration:underline; font-weight:600; font-size:15px; }
  .grow { flex:1; }
  .save { font-size:13px; color:var(--muted); min-height:18px; }
  .save.err { color:var(--err); font-weight:600; }
  .msg { text-align:center; padding:28px 18px; }
  .msg .ic { font-size:46px; line-height:1; margin-bottom:10px; }
  .msg h2 { margin-bottom:8px; }
  .note { border-radius:10px; padding:10px 12px; font-size:14px; margin:10px 0 0; }
  .note.warn { background:var(--warn-bg); color:var(--warn); }
  .note.err { background:var(--err-bg); color:var(--err); }
  .note.ok { background:var(--ok-bg); color:var(--ok); }
  .review dl { margin:0; }
  .review .sec { border-top:1px solid var(--border); padding:12px 0 4px; }
  .review .sec:first-child { border-top:none; padding-top:0; }
  .review .sec-h { display:flex; justify-content:space-between; align-items:center; font-weight:700; color:var(--primary); }
  .review dt { font-size:13px; color:var(--muted); margin-top:8px; }
  .review dd { margin:0; white-space:pre-wrap; word-break:break-word; }
  .review dd.empty { color:#9aa1ab; font-style:italic; }
  .decl { display:flex; gap:12px; align-items:flex-start; padding:14px; border:1.5px solid var(--primary-light); border-radius:12px; background:#eef7f1; margin-top:14px; cursor:pointer; }
  .decl input { width:24px; height:24px; flex:none; margin:2px 0 0; accent-color:var(--primary-light); }
  .contact { font-size:14px; color:var(--muted); text-align:center; margin-top:18px; }
  .contact a { color:var(--primary); font-weight:700; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  @media (prefers-reduced-motion: reduce) { .bar > span { transition:none; } }
</style>
</head>
<body>
<header><div class="hd">
  <div class="logo"><img src="intake/wg-logo.png" alt="Worn Gundidj"></div>
  <div><h1>Social &amp; Emotional Wellbeing</h1><p>Your intake form · Worn Gundidj Aboriginal Co-operative</p></div>
</div></header>
<main id="main" aria-live="polite"><div class="card msg"><div class="ic">⏳</div><p>Opening your form…</p></div></main>
<div class="nav" id="nav" hidden><div class="in">
  <button class="btn" id="btn-back" type="button">Back</button>
  <div class="grow save" id="save-status" role="status" aria-live="polite"></div>
  <button class="btn primary" id="btn-next" type="button">Next</button>
</div></div>

<script src="vendor/firebase/firebase-app-compat.js"></script>
<script src="vendor/firebase/firebase-firestore-compat.js"></script>
<script src="intake/intake-fields.js"></script>
<script>
(function () {
  'use strict';
  const CFG = { apiKey: 'AIzaSyB5llVjMjy0AOp9w5UlKW3FltUi8XUZj40', authDomain: 'worn-gundidj-cms.firebaseapp.com',
                projectId: 'worn-gundidj-cms', appId: '1:1058581942911:web:6769b34a10ccf95ea9a54a' };
  const TEAM = 'worngundidj', ORG_PHONE = '(03) 5561 5315', ORG_TEL = '0355615315';
  const I = window.WG_INTAKE, STEPS = I.STEPS, REVIEW = STEPS.length;   // the last "step" is the review
  const $ = id => document.getElementById(id);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let db, token = '', formRef = null, answers = {}, step = 0, expires = null, saveTimer = null, saving = false, pending = false, tries = 0;

  const contactHTML = () => `<p class="contact">Need help or want to do this with a worker? Call <a href="tel:${ORG_TEL}">${ORG_PHONE}</a></p>`;
  function screen(icon, title, text, extra) {
    $('nav').hidden = true;
    $('main').innerHTML = `<div class="card msg"><div class="ic" aria-hidden="true">${icon}</div><h2 tabindex="-1" id="h">${esc(title)}</h2><p>${text}</p>${extra || ''}</div>${contactHTML()}`;
    $('h') && $('h').focus();
  }
  const fmtDate = d => d ? d.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' }) : '';
  const toDate = v => (v && v.toDate ? v.toDate() : v ? new Date(v) : null);
  const expiredScreen = () => screen('⌛', 'This link has expired', 'For your privacy, intake links only work for a short time. Please contact us and we’ll send you a new one.');

  async function sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // ---- open ----
  async function start() {
    token = (location.hash || '').replace(/^#/, '').split(/[?&]/)[0];
    if (!/^[A-Za-z0-9_-]{16,64}$/.test(token)) return screen('🔗', 'This link isn’t complete', 'Please open the link exactly as it was sent to you. If it still doesn’t work, contact us.');
    if (!window.crypto || !crypto.subtle) return screen('⚠️', 'Please open this link in your phone’s web browser', 'This page needs a secure browser connection.');
    try {
      firebase.initializeApp(CFG);
      db = firebase.firestore();
      const emu = new URLSearchParams(location.search).get('emu');          // automated tests only, never on the live site
      if (emu && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) { const [h, p] = emu.split(':'); db.useEmulator(h, Number(p)); }
      const link = await db.collection('teams').doc(TEAM).collection('intakeLinks').doc(token).get();
      if (!link.exists) return expiredScreen();
      const L = link.data();
      expires = toDate(L.expiresAt);
      if (L.status === 'cancelled') return screen('🔒', 'This link is no longer active', 'Your worker has closed this link. Please contact us if you still need to fill in your form.');
      if (L.status === 'applied') return screen('✅', 'Thank you — we have your form', 'Your worker has already added your answers to your file.');
      if (!expires || expires.getTime() <= Date.now()) return expiredScreen();
      if (L.needsDob) return dobScreen();
      return openForm('');
    } catch (e) {
      console.warn(e);
      return screen('📶', 'We couldn’t open your form', 'Please check your internet connection and try again.', `<button class="btn primary" type="button" onclick="location.reload()">Try again</button>`);
    }
  }
  function dobScreen(err) {
    $('nav').hidden = true;
    $('main').innerHTML = `<div class="card">
      <h2 tabindex="-1" id="h">Welcome</h2>
      <p class="intro">To keep your information private, please enter your date of birth to open your form.</p>
      <form id="dob-form" novalidate>
        <div class="f"><label for="dob-in">Date of birth</label><input type="date" id="dob-in" required autocomplete="bday" max="${new Date().toISOString().slice(0, 10)}"></div>
        ${err ? `<div class="note err" role="alert">${esc(err)}</div>` : ''}
        <p style="margin:16px 0 0"><button class="btn primary" type="submit" style="width:100%">Open my form</button></p>
      </form></div>${contactHTML()}`;
    $('dob-form').addEventListener('submit', async ev => {
      ev.preventDefault();
      const v = $('dob-in').value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return dobScreen('Please enter your date of birth.');
      if (tries >= 6) return screen('🔒', 'Please contact us', 'That date of birth doesn’t match our records. Please call us and we’ll help you open your form.');
      const ok = await openForm(v);
      if (ok === false) { tries++; dobScreen('That date of birth doesn’t match our records. Please check it and try again.'); }
    });
    $('h').focus();
  }
  async function openForm(dob) {
    const id = await sha256(token + ':' + dob);
    formRef = db.collection('teams').doc(TEAM).collection('intakeForms').doc(id);
    let snap;
    try { snap = await formRef.get(); }
    catch (e) { if (dob) return false; if (e && e.code === 'permission-denied') return expiredScreen(); throw e; }
    if (!snap.exists) { if (dob) return false; return expiredScreen(); }
    const F = snap.data();
    expires = toDate(F.expiresAt) || expires;
    if (F.status === 'submitted') return doneScreen(true);
    answers = Object.assign({}, F.answers || {});
    delete answers.declaration;
    const local = readLocal(); if (local) { answers = Object.assign(answers, local); pending = true; scheduleSave(200); }
    step = Math.min(Math.max(0, Number(F.step) || 0), REVIEW);
    render(true);
    return true;
  }

  // ---- render ----
  function fieldHTML(f) {
    const v = answers[f.key], id = 'q-' + f.key, max = I.MAX_LEN[f.type] || 200;
    const help = f.help ? `<p class="help" id="${id}-h">${esc(f.help)}</p>` : '';
    const desc = f.help ? ` aria-describedby="${id}-h"` : '';
    if (f.type === 'services') {
      const sel = Array.isArray(v) ? v : [], groups = [...new Set(I.SERVICES.map(x => x[2]))];
      return `<fieldset class="f"${desc}><legend>${esc(f.label)}</legend>${help}${groups.map(g => `<p class="grp">${esc(g)}</p><div class="opts cols">${I.SERVICES.filter(x => x[2] === g).map(([val, label]) =>
        `<label class="opt"><input type="checkbox" name="${id}" value="${esc(val)}" data-key="${f.key}" ${sel.includes(val) ? 'checked' : ''}> <span>${esc(label)}</span></label>`).join('')}</div>`).join('')}</fieldset>`;
    }
    if (f.type === 'radio' || f.type === 'checks' || f.type === 'services') {
      const opts = f.type === 'services' ? I.SERVICES : f.options.map(o => [o, o]);
      const multi = f.type !== 'radio', sel = multi ? (Array.isArray(v) ? v : []) : v;
      return `<fieldset class="f"${desc}><legend>${esc(f.label)}</legend>${help}<div class="opts${opts.length > 5 ? ' cols' : ''}">${opts.map(([val, label]) =>
        `<label class="opt"><input type="${multi ? 'checkbox' : 'radio'}" name="${id}" value="${esc(val)}" data-key="${f.key}" ${multi ? (sel.includes(val) ? 'checked' : '') : (sel === val ? 'checked' : '')}> <span>${esc(label)}</span></label>`).join('')}</div></fieldset>`;
    }
    const req = f.required ? ' required aria-required="true"' : '', ac = f.autocomplete ? ` autocomplete="${f.autocomplete}"` : '';
    const input = f.type === 'textarea'
      ? `<textarea id="${id}" data-key="${f.key}" rows="${f.rows || 3}" maxlength="${max}"${req}${desc}>${esc(v || '')}</textarea>`
      : `<input type="${f.type}" id="${id}" data-key="${f.key}" value="${esc(v || '')}" maxlength="${max}"${req}${ac}${desc}${f.type === 'tel' ? ' inputmode="tel"' : ''}${f.type === 'date' ? ` max="${new Date().toISOString().slice(0, 10)}"` : ''}>`;
    return `<div class="f"><label for="${id}">${esc(f.label)}${f.required ? ' <span aria-hidden="true" style="color:var(--err)">*</span>' : ''}</label>${help}${input}</div>`;
  }
  function render(first) {
    const total = REVIEW + 1, pct = Math.round(((step + 1) / total) * 100);
    const prog = `<div class="progress"><span>Step ${step + 1} of ${total}</span><div class="bar" aria-hidden="true"><span style="width:${pct}%"></span></div></div>`;
    if (step < REVIEW) {
      const S = STEPS[step];
      const welcome = step === 0 ? `<div class="card" style="background:#eef7f1;border-color:#b7dcc4"><p style="margin:0"><strong>Welcome to Worn Gundidj.</strong> This form helps us get to know you before we meet. It takes about 10 minutes and <strong>saves as you go</strong> — you can stop and come back with the same link${expires ? ' until ' + esc(fmtDate(expires)) : ''}. Only answer what you’re comfortable with; your worker will go through it with you.</p><p style="margin:8px 0 0;font-size:14px;color:var(--muted)">Your information is private. It is only seen by Worn Gundidj staff and is kept on your file.</p></div>` : '';
      $('main').innerHTML = `${prog}${welcome}<div class="card"><h2 tabindex="-1" id="h">${esc(S.title)}</h2>${S.intro ? `<p class="intro">${esc(S.intro)}</p>` : ''}${S.fields.map(fieldHTML).join('')}</div>${contactHTML()}`;
    } else {
      $('main').innerHTML = `${prog}<div class="card review"><h2 tabindex="-1" id="h">Check and send</h2><p class="intro">Have a look over your answers. Tap <em>Change</em> to fix anything.</p>
        ${STEPS.map((S, i) => `<div class="sec"><div class="sec-h"><span>${esc(S.title)}</span><button class="btn link" type="button" data-goto="${i}">Change<span class="sr"> ${esc(S.title)}</span></button></div><dl>${S.fields.map(f => {
          const v = answers[f.key], shown = Array.isArray(v) ? (f.type === 'services' ? v.map(k => (I.SERVICES.find(s => s[0] === k) || [k, k])[1]) : v).join(', ') : (f.type === 'date' && v ? new Date(v + 'T00:00').toLocaleDateString('en-AU') : v);
          return `<dt>${esc(f.label)}</dt><dd class="${shown ? '' : 'empty'}">${shown ? esc(shown) : 'Not answered'}</dd>`; }).join('')}</dl></div>`).join('')}
        <label class="decl"><input type="checkbox" id="decl"> <span>The information I’ve given is true to the best of my knowledge, and I’m happy for Worn Gundidj to add it to my file.</span></label>
        <div id="send-err"></div></div>${contactHTML()}`;
      $('main').querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => go(Number(b.dataset.goto))));
    }
    $('nav').hidden = false;
    $('btn-back').hidden = step === 0;
    $('btn-next').textContent = step < REVIEW - 1 ? 'Next' : step === REVIEW - 1 ? 'Check my answers' : 'Send my form';
    $('main').querySelectorAll('[data-key]').forEach(el => el.addEventListener(el.type === 'checkbox' || el.type === 'radio' ? 'change' : 'input', onChange));
    if (!first) { window.scrollTo(0, 0); $('h') && $('h').focus({ preventScroll: true }); }
    showSave();
  }
  function onChange(ev) {
    const el = ev.target, key = el.dataset.key, f = I.FIELDS.find(x => x.key === key);
    if (!f) return;
    if (f.type === 'checks' || f.type === 'services') answers[key] = [...$('main').querySelectorAll(`input[data-key="${key}"]:checked`)].map(x => x.value);
    else answers[key] = el.value;
    pending = true; writeLocal(); scheduleSave(1200); showSave();
  }
  function go(n) { step = Math.min(Math.max(0, n), REVIEW); pending = true; scheduleSave(10); render(); }

  // ---- save ----
  const LKEY = () => 'wg-intake-' + token;
  function writeLocal() { try { localStorage.setItem(LKEY(), JSON.stringify(clean())); } catch (_) {} }
  function readLocal() { try { const v = JSON.parse(localStorage.getItem(LKEY()) || 'null'); return v && typeof v === 'object' ? v : null; } catch (_) { return null; } }
  function clearLocal() { try { localStorage.removeItem(LKEY()); } catch (_) {} }
  function clean() {
    const out = {};
    for (const f of I.FIELDS) {
      const v = answers[f.key];
      if (v === undefined) continue;
      if (Array.isArray(v)) out[f.key] = v.map(String).slice(0, 60);
      else out[f.key] = String(v).slice(0, I.MAX_LEN[f.type] || 200);
    }
    return out;
  }
  function scheduleSave(ms) { clearTimeout(saveTimer); saveTimer = setTimeout(save, ms); }
  async function save() {
    if (!pending || !formRef) return true;
    if (saving) { scheduleSave(800); return false; }
    saving = true; pending = false; showSave('saving');
    try {
      await formRef.update({ answers: clean(), status: 'draft', savedAt: new Date().toISOString(), step });
      saving = false; clearLocal(); showSave('saved'); return true;
    } catch (e) {
      saving = false; pending = true; console.warn('save failed', e);
      if (e && e.code === 'permission-denied') { clearTimeout(saveTimer); expiredScreen(); return false; }
      showSave('error'); scheduleSave(8000); return false;
    }
  }
  function showSave(state) {
    const el = $('save-status'); if (!el) return;
    el.classList.toggle('err', state === 'error');
    el.textContent = state === 'saving' ? 'Saving…' : state === 'saved' ? '✓ Saved' : state === 'error' ? 'Not saved — no connection. We’ll keep trying.' : pending ? '' : el.textContent;
  }
  window.addEventListener('online', () => { if (pending) scheduleSave(100); });
  window.addEventListener('hashchange', () => location.reload());     // a different link pasted into the same tab
  window.addEventListener('pagehide', () => { if (pending) writeLocal(); });

  // ---- send ----
  async function submit() {
    const err = t => { $('send-err').innerHTML = `<div class="note err" role="alert">${esc(t)}</div>`; };
    if (!String(answers.fullName || '').trim()) { err('Please add your name (in "About you").'); return; }
    if (!$('decl').checked) { err('Please tick the box to confirm, then send.'); $('decl').focus(); return; }
    const btn = $('btn-next'); btn.disabled = true; btn.textContent = 'Sending…';
    clearTimeout(saveTimer);
    try {
      await formRef.update({ answers: Object.assign(clean(), { declaration: true }), status: 'submitted', submittedAt: new Date().toISOString(), step: REVIEW });
      clearLocal(); pending = false; doneScreen(false);
    } catch (e) {
      console.warn(e); btn.disabled = false; btn.textContent = 'Send my form';
      if (e && e.code === 'permission-denied') return expiredScreen();
      err('We couldn’t send it — please check your internet connection and try again. Your answers are saved on this phone.');
      writeLocal();
    }
  }
  function doneScreen(already) {
    clearLocal();
    screen('🌿', already ? 'You’ve already sent your form' : 'Thank you — your form has been sent',
      already ? 'We have your answers. Your worker will go through them with you.' : 'Your worker will go through your answers with you and add them to your file. You can close this page now.');
  }

  $('btn-back').addEventListener('click', () => go(step - 1));
  $('btn-next').addEventListener('click', async () => {
    if (step < REVIEW) {
      const bad = STEPS[step].fields.find(f => f.required && !String(answers[f.key] || '').trim());
      if (bad) { const el = $('q-' + bad.key); el && el.focus(); el && el.setAttribute('aria-invalid', 'true'); showSave(); $('save-status').textContent = 'Please fill in: ' + bad.label; return; }
      go(step + 1);
    } else submit();
  });
  start();
})();
</script>
</body>
</html>
