[[headers]]
  for = "/*"
  [headers.values]
    # Force HTTPS for 2 years incl. subdomains (protects the auth token / PHI in transit)
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Stop browsers sniffing MIME types
    X-Content-Type-Options = "nosniff"
    # Only send referrer to same origin
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Restrict permissions
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"
    # Content Security Policy
    # - default: self only
    # - scripts: self (incl. self-hosted Firebase + Microsoft MSAL) + Google + reCAPTCHA (SMS MFA)
    # - connect: Firebase Firestore/Auth APIs + Microsoft login + reCAPTCHA
    # - frame:   reCAPTCHA challenge iframe (mandatory for phone MFA)
    # - manifest: allow the embedded data: PWA manifest
    # - style: self + inline (required by the single-file app)
    # - img: self + data URIs (avatars, logos)
    # - frame-ancestors: none (no embedding)
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline'
        https://www.gstatic.com
        https://www.googleapis.com
        https://www.google.com
        https://www.recaptcha.net
        https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline';
      connect-src 'self'
        https://*.googleapis.com
        https://*.firebaseio.com
        https://*.firebase.com
        https://firestore.googleapis.com
        https://identitytoolkit.googleapis.com
        https://securetoken.googleapis.com
        https://login.microsoftonline.com
        https://graph.microsoft.com
        https://api.ipify.org
        https://*.firebasestorage.googleapis.com
        https://www.google.com
        https://www.recaptcha.net
        https://www.google-analytics.com
        https://analytics.google.com
        https://region1.google-analytics.com;
      img-src 'self' data: https:;
      font-src 'self' data:;
      media-src 'self';
      worker-src 'self';
      manifest-src 'self' data:;
      frame-src https://www.google.com https://www.recaptcha.net;
      frame-ancestors 'none';
      form-action 'self';
      base-uri 'self';
    """

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# Cross-Origin-Opener-Policy for the app page only. "same-origin-allow-popups"
# keeps the window isolated but lets the Microsoft sign-in popup it opens (Outlook
# calendar sync) report back — the old "same-origin" cut the popup off, so sign-in
# always ended as "user_cancelled". auth-redirect.html (where Microsoft returns,
# inside the popup) must NOT have this header, so it is not set on "/*".
[[headers]]
  for = "/"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
